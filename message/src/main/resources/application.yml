server:
  port: 8084

spring:
  application:
    name: "message"

  cloud:
    function:
      # email|sms: account-creation communication; transferNotification: TransferCompleted events
      definition: email|sms;transferNotification
    stream:
      bindings:
        emailsms-in-0:
          destination: send-communication
          group: ${spring.application.name}
        emailsms-out-0:
          destination: communication-sent
        transferNotification-in-0:
          destination: transfer-completed
          group: ${spring.application.name}
      kafka:
        binder:
          brokers:
            - localhost:9092
